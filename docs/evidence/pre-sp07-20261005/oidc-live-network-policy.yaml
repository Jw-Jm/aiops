---
# Source: ops-platform/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-default-deny
  labels:
    ops.platform.io/release: "ops-platform"
    ops.platform.io/policy: default-deny
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/release
        operator: In
        values:
          - "ops-platform"
          - "ops-oidc-dependencies"
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, investigator, command-runner, postgresql, keycloak, seaweedfs, openbao, victoria-metrics, victoria-logs, vmalert]
  policyTypes:
    - Ingress
    - Egress
