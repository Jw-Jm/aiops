# Source: ops-platform/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-allow-internal-platform-traffic
  labels:
    ops.platform.io/release: "ops-platform"
    ops.platform.io/policy: allow-internal
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/release
        operator: In
        values:
          - "ops-platform"
          - "ops-oidc-dependencies"
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, command-runner, postgresql, keycloak, seaweedfs, openbao, victoria-metrics, victoria-logs, vmalert]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-pre-sp07-oidc-20261005
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8333
        - protocol: TCP
          port: 8428
        - protocol: TCP
          port: 9428
        - protocol: TCP
          port: 8880
        - protocol: TCP
          port: 9090
        
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-pre-sp07-oidc-20261005
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
