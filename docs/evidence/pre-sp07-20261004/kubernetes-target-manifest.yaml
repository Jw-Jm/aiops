apiVersion: v1
kind: Namespace
metadata:
  name: ops-pre-sp07-targets-20261004
  labels:
    ops.platform.io/owner: pre-sp07-20261004
    ops.platform.io/purpose: target-preparation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readiness-data
  namespace: ops-pre-sp07-targets-20261004
  labels: {ops.platform.io/owner: pre-sp07-20261004}
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-storage
  namespace: ops-pre-sp07-targets-20261004
  labels: {ops.platform.io/owner: pre-sp07-20261004, app: readiness-storage}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
  containers:
    - name: target
      image: python@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      imagePullPolicy: Never
      command: [python3, -m, http.server, '8080', --directory, /data]
      ports: [{containerPort: 8080}]
      securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
      readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
      volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: readiness-data}
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-scheduling
  namespace: ops-pre-sp07-targets-20261004
  labels: {ops.platform.io/owner: pre-sp07-20261004, app: readiness-scheduling}
spec:
  automountServiceAccountToken: false
  nodeSelector: {ops.platform.io/nonexistent-readiness-node: 'true'}
  containers:
    - name: target
      image: python@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      imagePullPolicy: Never
      command: [python3, -c, 'import time; time.sleep(604800)']
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-isolation
  namespace: ops-pre-sp07-targets-20261004
  labels: {ops.platform.io/owner: pre-sp07-20261004}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress: []
