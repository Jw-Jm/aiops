# Source: ops-metrics-server/templates/metrics.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre-sp07-metrics
  namespace: ops-pre-sp07-metrics-20261004
  labels: {app.kubernetes.io/instance: pre-sp07}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pre-sp07-metrics}
  strategy:
    rollingUpdate: {maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pre-sp07-metrics, app.kubernetes.io/instance: pre-sp07}
    spec:
      serviceAccountName: pre-sp07-metrics
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: arm64}
      containers:
        - name: metrics-server
          image: "registry.k8s.io/metrics-server/metrics-server@sha256:8f49cf1b0688bb0eae18437882dbf6de2c7a2baac71b1492bc4eca25439a1bf2"
          imagePullPolicy: Never
          args:
            - --secure-port=10250
            - --tls-cert-file=/etc/metrics-serving/tls.crt
            - --tls-private-key-file=/etc/metrics-serving/tls.key
            - --kubelet-certificate-authority=/etc/kubelet-ca/ca.crt
            - --kubelet-preferred-address-types=InternalIP
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
          ports: [{name: https, containerPort: 10250}]
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: serving, mountPath: /etc/metrics-serving, readOnly: true}
            - {name: kubelet-ca, mountPath: /etc/kubelet-ca, readOnly: true}
      volumes:
        - name: serving
          secret: {secretName: pre-sp07-metrics-tls, defaultMode: 0444}
        - name: kubelet-ca
          configMap: {name: pre-sp07-metrics-kubelet-ca}
