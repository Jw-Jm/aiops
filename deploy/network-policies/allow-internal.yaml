apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-allow-internal-platform-traffic
  namespace: ops-system
  labels:
    ops.platform.io/policy: allow-internal
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, investigator, command-runner, postgresql, keycloak, seaweedfs, openbao]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-system
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8333
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
