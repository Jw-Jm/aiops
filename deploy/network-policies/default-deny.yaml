apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-default-deny
  namespace: ops-system
  labels:
    ops.platform.io/policy: default-deny
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, investigator, command-runner, postgresql, keycloak, seaweedfs, openbao]
  policyTypes:
    - Ingress
    - Egress
