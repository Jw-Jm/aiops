{{- $name := printf "%s-metrics" .Release.Name -}}
{{- if not .Values.networkPolicyOnly }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-auth-delegator
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-auth-reader
  namespace: kube-system
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  strategy:
    rollingUpdate: {maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ $name }}
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: arm64}
      containers:
        - name: metrics-server
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          args:
            - --secure-port=10250
            - --tls-cert-file=/etc/metrics-serving/tls.crt
            - --tls-private-key-file=/etc/metrics-serving/tls.key
            - --kubelet-certificate-authority=/etc/kubelet-ca/ca.crt
            - --kubelet-preferred-address-types=InternalIP
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
          ports: [{name: https, containerPort: 10250}]
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: serving, mountPath: /etc/metrics-serving, readOnly: true}
            - {name: kubelet-ca, mountPath: /etc/kubelet-ca, readOnly: true}
      volumes:
        - name: serving
          secret: {secretName: {{ required "serving TLS identity required" .Values.servingTLSSecret }}, defaultMode: 0440}
        - name: kubelet-ca
          configMap: {name: {{ required "independent kubelet CA required" .Values.kubeletCAConfigMap }}}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
spec:
  group: metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  caBundle: {{ required "independent serving CA required" .Values.servingCA | b64enc | quote }}
  service: {name: {{ $name }}, namespace: {{ .Release.Namespace }}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, ops.platform.io/release: {{ .Release.Name }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 10250}]
  egress:
    - to:
        {{- range .Values.nodeCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 10250}]
    - to:
        {{- range .Values.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.apiServerPort }}}]
