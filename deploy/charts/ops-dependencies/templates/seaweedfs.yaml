{{- $component := .Values.components.seaweedfs -}}
{{- if eq $component.mode "bundled" }}
apiVersion: v1
kind: Service
metadata:
  name: ops-seaweedfs-s3
  labels:
    app.kubernetes.io/name: ops-seaweedfs
    ops.platform.io/component: seaweedfs
    ops.platform.io/mode: bundled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops-seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: master
      port: 9333
      targetPort: master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ops-seaweedfs
  labels:
    app.kubernetes.io/name: ops-seaweedfs
    ops.platform.io/component: seaweedfs
    ops.platform.io/mode: bundled
spec:
  serviceName: ops-seaweedfs-s3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-seaweedfs
        ops.platform.io/component: seaweedfs
        ops.platform.io/mode: bundled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: ["weed"]
          args: ["server", "-dir=/data", "-s3", "-volume.max=5"]
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          ops.platform.io/component: seaweedfs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $component.storage | quote }}
{{- end }}
