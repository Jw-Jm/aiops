{{- $component := .Values.components.keycloak -}}
{{- $tls := hasPrefix "https://" $component.endpoint -}}
{{- if eq $component.mode "bundled" }}
apiVersion: v1
kind: Service
metadata:
  name: ops-keycloak
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    app.kubernetes.io/name: ops-keycloak
    ops.platform.io/component: keycloak
    ops.platform.io/mode: bundled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops-keycloak
  ports:
    - name: {{ ternary "https" "http" $tls }}
      port: {{ ternary 8443 8080 $tls }}
      targetPort: {{ ternary "https" "http" $tls }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-keycloak
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    app.kubernetes.io/name: ops-keycloak
    ops.platform.io/component: keycloak
    ops.platform.io/mode: bundled
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-keycloak
  template:
    metadata:
      labels:
        ops.platform.io/release: {{ $.Release.Name | quote }}
        app.kubernetes.io/name: ops-keycloak
        ops.platform.io/component: keycloak
        ops.platform.io/mode: bundled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-keycloak
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - >-
              shopt -s dotglob && cp -R /opt/keycloak/* /work/ &&
              /work/bin/kc.sh build --db=postgres --health-enabled=true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: distribution
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      containers:
        - name: keycloak
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["start", "--optimized", "--hostname-strict=false"]
          ports:
            - name: {{ ternary "https" "http" $tls }}
              containerPort: {{ ternary 8443 8080 $tls }}
            - name: management
              containerPort: 9000
          env:
            - name: KC_HOSTNAME
              value: {{ required "components.keycloak.endpoint is required" $component.endpoint | quote }}
            - name: KC_HTTP_ENABLED
              value: {{ ternary "false" "true" $tls | quote }}
            {{ if $tls }}
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/keycloak/tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/keycloak/tls/tls.key
            - name: KC_HTTP_MANAGEMENT_SCHEME
              value: http
            {{ end }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:%s/ops" (trimSuffix "/" (required "components.postgresql.endpoint is required" $.Values.components.postgresql.endpoint)) | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.components.postgresql.auth.existingSecret | quote }}
                  key: {{ $.Values.components.postgresql.auth.usernameKey | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.components.postgresql.auth.existingSecret | quote }}
                  key: {{ $.Values.components.postgresql.auth.passwordKey | quote }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $component.auth.existingSecret | quote }}
                  key: {{ $component.auth.usernameKey | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $component.auth.existingSecret | quote }}
                  key: {{ $component.auth.passwordKey | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{ if $tls }}
            - name: tls
              mountPath: /etc/keycloak/tls
              readOnly: true
            {{ end }}
            - name: distribution
              mountPath: /opt/keycloak
              readOnly: true
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      volumes:
        {{ if $tls }}
        - name: tls
          secret:
            secretName: {{ required "components.keycloak.tlsSecretName is required for HTTPS" $component.tlsSecretName | quote }}
        {{ end }}
        - name: distribution
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
