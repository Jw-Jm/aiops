{{- $component := .Values.components.postgresql -}}
{{- if eq $component.mode "bundled" }}
apiVersion: v1
kind: Service
metadata:
  name: ops-postgresql
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    app.kubernetes.io/name: ops-postgresql
    ops.platform.io/component: postgresql
    ops.platform.io/mode: bundled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ops-postgresql
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    app.kubernetes.io/name: ops-postgresql
    ops.platform.io/component: postgresql
    ops.platform.io/mode: bundled
spec:
  serviceName: ops-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-postgresql
  template:
    metadata:
      labels:
        ops.platform.io/release: {{ $.Release.Name | quote }}
        app.kubernetes.io/name: ops-postgresql
        ops.platform.io/component: postgresql
        ops.platform.io/mode: bundled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["-c", "listen_addresses=*"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ops
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $component.auth.existingSecret | quote }}
                  key: {{ $component.auth.usernameKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $component.auth.existingSecret | quote }}
                  key: {{ $component.auth.passwordKey | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          ops.platform.io/release: {{ $.Release.Name | quote }}
          ops.platform.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $component.storage | quote }}
{{- end }}
