workloadsEnabled: false
global:
  imagePullPolicy: Never
networkPolicyOnly: false
bootstrapAPIOnly: false
workloadIdentity:
  enabled: true
  mode: file
observability:
  # auto resolves from the installed CRDs; explicit values are reserved for offline render checks.
  scrapeKind: auto
  scrapeInterval: 30s
networkPolicy:
  managedDependencyReleases: [ops-dependencies]
  externalServices: []
components:
  api:
    enabled: true
    port: 8080
    metricsPort: 9090
  worker:
    enabled: true
    port: 8081
    metricsPort: 9090
  web:
    enabled: true
    port: 3000
  investigator:
    enabled: true
    port: 8090
  command-runner:
    enabled: true
    port: 8091

# SP04 uses the existing Worker. Identity and source credentials are provisioned
# independently and never embedded in ConfigMap or Bundle values.
sp04:
  enabled: false
  graphPort: 8082
  workerReplicas: 2
  apiIdentitySecret: ops-sp04-api-identity
  workerIdentitySecret: ops-sp04-worker-identity
  sourceCredentialsSecret: ops-sp04-source-credentials
  allowedWorkerCIDRs: []
  archiveBackendLogicalID: ""
  clusters: []
  sources: []
  kubernetesAPI:
    # Exact /32 or /128 control-plane endpoints; broad public egress is refused.
    cidrs: []
    port: 6443
    localCollector: false
  leaseNames: []

# SP05 runs inside the existing API/Worker, without an investigator or commands.
sp05:
  enabled: false
  ingestionBindings: []
  analyzer:
    enabled: true
    # Filled from the admitted locked-source Worker build, never a mutable tag.
    sha256: "6f9152ff31d2692a14e880ae73c2fe35dbc2938560d2c55227f4b0c67409af53"

# SP06 is opt-in; exactly one additional resident component is introduced.
sp06:
  enabled: false
  gatewayPort: 8083
  policyName: sp06-read-only
  identitySecret: ops-sp06-investigator-identity
  modelKeySecret: ops-sp06-model-key
  tenants: []
  modelCIDRs: []
  modelPort: 11434
  model:
    base_url: http://127.0.0.1:11434/v1
    api_key_ref: secret://model/api-key
    model: llama3.1:8b-16k
    timeout: 45
    token_budget: 1024
  budget:
    durationSeconds: 600
    toolCalls: 40
    rawQueries: 10
    resultBytes: 41943040
    graphNodes: 8000
    evidenceItems: 4000
    modelRequests: 8
    inputTokens: 32768
    outputTokens: 8192
    modelCostMicros: 0
    allowedDataClasses: [D0, D1]

# SP07 only runs one-shot Jobs in the existing platform namespace.
sp07:
  enabled: false
  gatewayPort: 8084
  policyName: sp07-command
  tenants: []
  admittedProfiles: []
  hosts: []
  hostReports: []
  kubernetesCredentials: []
  kubernetesEndpoint: https://kubernetes.default.svc.cluster.local
  workloadCABundle: ""
