workloadsEnabled: false
global:
  imagePullPolicy: IfNotPresent
networkPolicyOnly: false
workloadIdentity:
  enabled: true
observability:
  # auto resolves from the installed CRDs; explicit values are reserved for offline render checks.
  scrapeKind: auto
  scrapeInterval: 30s
networkPolicy:
  managedDependencyReleases: [ops-dependencies]
  externalServices: []
components:
  api:
    enabled: true
    port: 8080
    metricsPort: 9090
  worker:
    enabled: true
    port: 8081
    metricsPort: 9090
  web:
    enabled: true
    port: 3000
  investigator:
    enabled: true
    port: 8090
  command-runner:
    enabled: true
    port: 8091

# SP04 uses the existing Worker. Identity and source credentials are provisioned
# independently and never embedded in ConfigMap or Bundle values.
sp04:
  enabled: false
  graphPort: 8082
  workerReplicas: 2
  apiIdentitySecret: ops-sp04-api-identity
  workerIdentitySecret: ops-sp04-worker-identity
  sourceCredentialsSecret: ops-sp04-source-credentials
  allowedWorkerCIDRs: []
  archiveBackendLogicalID: ""
  clusters: []
  sources: []
  kubernetesAPI:
    # Exact /32 or /128 control-plane endpoints; broad public egress is refused.
    cidrs: []
    port: 6443
    localCollector: false
  leaseNames: []

# SP05 runs inside the existing API/Worker, without an investigator or commands.
sp05:
  enabled: false
  ingestionBindings: []
  analyzer:
    enabled: true
    # Filled from the admitted locked-source Worker build, never a mutable tag.
    sha256: "6f9152ff31d2692a14e880ae73c2fe35dbc2938560d2c55227f4b0c67409af53"
