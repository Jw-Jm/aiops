apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-default-deny
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    ops.platform.io/policy: default-deny
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/release
        operator: In
        values:
          - {{ $.Release.Name | quote }}
          {{- range $.Values.networkPolicy.managedDependencyReleases }}
          - {{ . | quote }}
          {{- end }}
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, investigator, command-runner, postgresql, keycloak, seaweedfs, openbao, victoria-metrics, victoria-logs, vmalert]
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-allow-internal-platform-traffic
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    ops.platform.io/policy: allow-internal
spec:
  podSelector:
    matchExpressions:
      - key: ops.platform.io/release
        operator: In
        values:
          - {{ $.Release.Name | quote }}
          {{- range $.Values.networkPolicy.managedDependencyReleases }}
          - {{ . | quote }}
          {{- end }}
      - key: ops.platform.io/component
        operator: In
        values: [api, worker, web, command-runner, postgresql, keycloak, seaweedfs, openbao, victoria-metrics, victoria-logs, vmalert]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8333
        - protocol: TCP
          port: 8428
        - protocol: TCP
          port: 9428
        - protocol: TCP
          port: 8880
        - protocol: TCP
          port: 9090
        {{ if $.Values.sp06.enabled }}
        - {protocol: TCP, port: {{ $.Values.sp06.gatewayPort }}}
        {{ end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range $.Values.networkPolicy.externalServices }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port | toJson }}
    {{- end }}
{{- if and .Values.sp04.enabled .Values.workloadIdentity.enabled (eq .Values.workloadIdentity.mode "openbao-kubernetes") }}
---
# Native Kubernetes authentication calls TokenReview during dependency bootstrap
# and continuously after activation. This never grants API egress to investigator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-openbao-kubernetes-egress
  labels:
    ops.platform.io/release: {{ .Release.Name | quote }}
spec:
  podSelector:
    matchLabels:
      ops.platform.io/component: openbao
    matchExpressions:
      - key: ops.platform.io/release
        operator: In
        values: {{ required "OpenBao TokenReview requires managed dependency releases" .Values.networkPolicy.managedDependencyReleases | toJson }}
  policyTypes: [Egress]
  egress:
    {{- range (required "OpenBao TokenReview requires exact Kubernetes control-plane CIDRs" .Values.sp04.kubernetesAPI.cidrs) }}
    {{- if not (or (hasSuffix "/32" .) (hasSuffix "/128" .)) }}{{ fail "OpenBao TokenReview egress must use exact host CIDRs" }}{{- end }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.sp04.kubernetesAPI.port }}
    {{- end }}
{{- end }}
