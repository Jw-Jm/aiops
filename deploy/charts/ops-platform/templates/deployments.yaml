{{- if and .Values.sp05.enabled (not .Values.sp04.enabled) }}{{ fail "SP05 requires the existing SP04 Graph/Evidence runtime" }}{{- end }}
{{- if and .Values.workloadsEnabled (not .Values.networkPolicyOnly) }}
{{- range $name := list "api" "worker" "web" }}
{{- $component := index $.Values.components $name }}
{{- if $component.enabled }}
{{- $image := required (printf "components.%s.image is required" $name) $component.image }}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) }}{{ fail "platform images must be digest pinned" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-{{ $name }}
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    ops.platform.io/component: {{ $name }}
spec:
  replicas: {{ if and (eq $name "worker") $.Values.sp04.enabled }}{{ $.Values.sp04.workerReplicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      ops.platform.io/component: {{ $name }}
  template:
    metadata:
      labels:
        ops.platform.io/release: {{ $.Release.Name | quote }}
        ops.platform.io/component: {{ $name }}
    spec:
      serviceAccountName: ops-{{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $component.imagePullPolicy | default $.Values.global.imagePullPolicy | quote }}
          ports:
            {{ if and $.Values.sp04.enabled (eq $name "worker") }}
            - name: graph-mtls
              containerPort: {{ $.Values.sp04.graphPort }}
              protocol: TCP
            {{ end }}
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
            {{ if has $name (list "api" "worker") }}
            - name: metrics
              containerPort: {{ $component.metricsPort | default 9090 }}
              protocol: TCP
            {{ end }}
          env:
            {{ if and $.Values.sp04.enabled (has $name (list "api" "worker")) }}
            - name: SP04_RUNTIME_FILE
              value: /etc/sp04/runtime/{{ $name }}.json
            {{ if eq $name "worker" }}
            - name: SP04_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SP04_OWNER_ENDPOINT
              value: "https://$(SP04_POD_IP):{{ $.Values.sp04.graphPort }}"
            {{ end }}
            {{ end }}
            {{ if has $name (list "api" "worker") }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-platform-runtime
                  key: {{ $name }}DatabaseURL
            {{ end }}
            - name: OIDC_ISSUER_URL
              value: {{ required "runtime.oidcIssuerURL is required" $.Values.runtime.oidcIssuerURL | quote }}
            - name: PLATFORM_PROFILE
              value: /etc/ops/profile.yaml
            {{ if eq $name "api" }}
            {{ if $.Values.runtime.oidcCABundle }}
            - name: SSL_CERT_FILE
              value: /etc/ops/oidc-ca.pem
            {{ end }}
            {{ end }}
            {{ if or (eq $name "api") (and (eq $name "worker") $.Values.sp05.enabled) }}
            - name: PLATFORM_REGISTRY_TRUST_FILE
              value: /etc/ops/registry-trust.json
            {{ end }}
            {{ if eq $name "worker" }}
            - name: OPENBAO_ADDR
              value: {{ $.Values.runtime.openbaoAddress | default (printf "https://ops-openbao.%s.svc.cluster.local:8200" $.Release.Namespace) | quote }}
            - name: OPENBAO_CA_FILE
              value: /etc/ops/openbao-ca.pem
            - name: OPENBAO_SERVICE_DOMAIN
              value: {{ printf "%s.svc.cluster.local" $.Release.Namespace | quote }}
            - name: S3_ENDPOINT
              value: {{ $.Values.runtime.archiveEndpoint | default (printf "https://ops-seaweedfs-s3.%s.svc.cluster.local:8333" $.Release.Namespace) | quote }}
            - name: S3_CA_FILE
              value: /etc/ops/archive-ca.pem
            - name: S3_BUCKET
              value: {{ $.Values.runtime.archiveBucket | default "" | quote }}
            - name: S3_TENANT_CREDENTIALS_FILE
              value: /etc/archive-credentials/tenants.json
            {{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{ if and $.Values.sp04.enabled (has $name (list "api" "worker")) }}
            - name: sp04-runtime
              mountPath: /etc/sp04/runtime
              readOnly: true
            - name: sp04-identity
              mountPath: /etc/sp04/identity
              readOnly: true
            {{ if eq $name "worker" }}
            - name: sp04-sources
              mountPath: /etc/sp04/sources
              readOnly: true
            {{ if $.Values.sp04.kubernetesAPI.localCollector }}
            - name: sp04-kubernetes
              mountPath: /var/run/secrets/ops-platform/kubernetes
              readOnly: true
            {{ end }}
            {{ end }}
            {{ end }}
            {{ if eq $name "worker" }}
            - name: archive-credentials
              mountPath: /etc/archive-credentials
              readOnly: true
            {{ end }}
            - name: profile
              mountPath: /etc/ops
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{ include "ops-platform.workloadIdentityMount" (dict "enabled" $.Values.workloadIdentity.enabled "name" $name) | indent 12 }}
      volumes:
        {{ if and $.Values.sp04.enabled (has $name (list "api" "worker")) }}
        - name: sp04-runtime
          configMap:
            name: ops-sp04-runtime
        - name: sp04-identity
          secret:
            secretName: {{ if eq $name "api" }}{{ $.Values.sp04.apiIdentitySecret }}{{ else }}{{ $.Values.sp04.workerIdentitySecret }}{{ end }}
            defaultMode: 0440
        {{ if eq $name "worker" }}
        - name: sp04-sources
          secret:
            secretName: {{ $.Values.sp04.sourceCredentialsSecret }}
            defaultMode: 0440
        {{ if $.Values.sp04.kubernetesAPI.localCollector }}
        - name: sp04-kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.pem
        {{ end }}
        {{ end }}
        {{ end }}
        {{ if eq $name "worker" }}
        - name: archive-credentials
          secret:
            secretName: ops-platform-runtime
            defaultMode: 0440
            items:
              - key: archiveTenantCredentials
                path: tenants.json
        {{ end }}
        - name: profile
          configMap:
            name: ops-core-profile
        - name: tmp
          emptyDir: {}
{{ include "ops-platform.workloadIdentityVolume" (dict "enabled" $.Values.workloadIdentity.enabled "name" $name) | indent 8 }}
---
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-core-profile
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
data:
  registry-trust.json: {{ $.Values.runtime.registryTrust | default dict | toJson | quote }}
  openbao-ca.pem: {{ $.Values.runtime.openbaoCABundle | default "" | quote }}
  archive-ca.pem: {{ $.Values.runtime.archiveCABundle | default "" | quote }}
  oidc-ca.pem: {{ $.Values.runtime.oidcCABundle | default "" | quote }}
  profile.yaml: |
{{ required "runtime.profile is required" .Values.runtime.profile | indent 4 }}
{{- end }}
