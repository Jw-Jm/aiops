{{- if and .Values.workloadsEnabled (not .Values.networkPolicyOnly) }}
{{- range $name := list "api" "worker" "web" }}
{{- $component := index $.Values.components $name }}
{{- if $component.enabled }}
{{- $image := required (printf "components.%s.image is required" $name) $component.image }}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) }}{{ fail "platform images must be digest pinned" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-{{ $name }}
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    ops.platform.io/component: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ops.platform.io/component: {{ $name }}
  template:
    metadata:
      labels:
        ops.platform.io/release: {{ $.Release.Name | quote }}
        ops.platform.io/component: {{ $name }}
    spec:
      serviceAccountName: ops-{{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
            {{ if has $name (list "api" "worker") }}
            - name: metrics
              containerPort: {{ $component.metricsPort | default 9090 }}
              protocol: TCP
            {{ end }}
          env:
            {{ if has $name (list "api" "worker") }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-platform-runtime
                  key: {{ $name }}DatabaseURL
            {{ end }}
            - name: OIDC_ISSUER_URL
              value: {{ required "runtime.oidcIssuerURL is required" $.Values.runtime.oidcIssuerURL | quote }}
            - name: PLATFORM_PROFILE
              value: /etc/ops/profile.yaml
            {{ if eq $name "api" }}
            {{ if $.Values.runtime.oidcCABundle }}
            - name: SSL_CERT_FILE
              value: /etc/ops/oidc-ca.pem
            {{ end }}
            - name: PLATFORM_REGISTRY_TRUST_FILE
              value: /etc/ops/registry-trust.json
            {{ end }}
            {{ if eq $name "worker" }}
            - name: OPENBAO_ADDR
              value: {{ $.Values.runtime.openbaoAddress | default (printf "https://ops-openbao.%s.svc.cluster.local:8200" $.Release.Namespace) | quote }}
            - name: OPENBAO_CA_FILE
              value: /etc/ops/openbao-ca.pem
            - name: OPENBAO_SERVICE_DOMAIN
              value: {{ printf "%s.svc.cluster.local" $.Release.Namespace | quote }}
            - name: S3_ENDPOINT
              value: {{ $.Values.runtime.archiveEndpoint | default (printf "https://ops-seaweedfs-s3.%s.svc.cluster.local:8333" $.Release.Namespace) | quote }}
            - name: S3_CA_FILE
              value: /etc/ops/archive-ca.pem
            - name: S3_BUCKET
              value: {{ $.Values.runtime.archiveBucket | default "" | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-platform-runtime
                  key: archiveAccessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-platform-runtime
                  key: archiveSecretKey
            {{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile
              mountPath: /etc/ops
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{ include "ops-platform.workloadIdentityMount" (dict "enabled" $.Values.workloadIdentity.enabled "name" $name) | indent 12 }}
      volumes:
        - name: profile
          configMap:
            name: ops-core-profile
        - name: tmp
          emptyDir: {}
{{ include "ops-platform.workloadIdentityVolume" (dict "enabled" $.Values.workloadIdentity.enabled "name" $name) | indent 8 }}
---
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-core-profile
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
data:
  registry-trust.json: {{ $.Values.runtime.registryTrust | default dict | toJson | quote }}
  openbao-ca.pem: {{ $.Values.runtime.openbaoCABundle | default "" | quote }}
  archive-ca.pem: {{ $.Values.runtime.archiveCABundle | default "" | quote }}
  oidc-ca.pem: {{ $.Values.runtime.oidcCABundle | default "" | quote }}
  profile.yaml: |
{{ required "runtime.profile is required" .Values.runtime.profile | indent 4 }}
{{- end }}
