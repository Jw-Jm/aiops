{{- if not .Values.networkPolicyOnly }}
{{- range $name, $component := .Values.components }}
{{- if or $component.enabled (and $.Values.sp06.enabled (eq $name "investigator")) }}
apiVersion: v1
kind: Service
metadata:
  name: ops-{{ $name }}
  labels:
    ops.platform.io/release: {{ $.Release.Name | quote }}
    ops.platform.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    ops.platform.io/component: {{ $name }}
  ports:
    {{ if and $.Values.sp07.enabled (eq $name "api") }}
    - {name: command-mtls, port: {{ $.Values.sp07.gatewayPort }}, targetPort: command-mtls}
    {{ end }}
    {{ if and $.Values.sp06.enabled (eq $name "api") }}
    - {name: mcp-mtls, port: {{ $.Values.sp06.gatewayPort }}, targetPort: mcp-mtls}
    {{ end }}
    {{ if and $.Values.sp04.enabled (eq $name "worker") }}
    - name: graph-mtls
      port: {{ $.Values.sp04.graphPort }}
      targetPort: graph-mtls
    {{ end }}
    - name: http
      port: {{ $component.port }}
      targetPort: http
    {{ if has $name (list "api" "worker") }}
    - name: metrics
      port: {{ $component.metricsPort | default 9090 }}
      targetPort: metrics
    {{ end }}
---
{{- end }}
{{- end }}
{{- end }}
