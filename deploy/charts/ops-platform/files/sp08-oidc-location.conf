 location /oidc/ {
  proxy_pass https://${OPS_OIDC_UPSTREAM}:8443/;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ops-oidc-ca/oidc-ca.pem;
  proxy_ssl_name ${OPS_OIDC_HOST};
  proxy_ssl_server_name on;
  proxy_set_header Host ${OPS_OIDC_HOST}:8443;
  proxy_set_header Accept-Encoding '';
  proxy_redirect https://${OPS_OIDC_HOST}:8443/ /oidc/;
  proxy_cookie_path / /oidc/;
  sub_filter_types text/html;
  sub_filter_once off;
  sub_filter 'https://${OPS_OIDC_HOST}:8443/' '${OPS_PUBLIC_ORIGIN}/oidc/';
 }
