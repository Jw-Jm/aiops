server {
 listen 8443 ssl;
 server_name _;
 ssl_certificate /etc/ops-tls/web.crt;
 ssl_certificate_key /etc/ops-tls/web.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /usr/share/nginx/html;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 location = /healthz { access_log off; return 200 'ready'; }
 location /api/ {
  proxy_pass http://${OPS_API_UPSTREAM}:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection '';
  proxy_buffering off;
  proxy_cache off;
  error_page 502 504 = @api_unavailable;
  proxy_read_timeout 650s;
 }
 location @api_unavailable { default_type application/json; return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"API connection unavailable; inspect durable records before retrying a mutation","requestId":"$request_id","retryable":true}'; }
${OPS_OIDC_LOCATION}
 location = /runtime-config.json { expires -1; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
