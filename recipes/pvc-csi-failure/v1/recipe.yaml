{
  "schemaVersion": "recipe-registry/v2",
  "name": "pvc-csi-failure",
  "version": "v1",
  "candidateType": "csi_provisioner_failure",
  "entry": [
    "PersistentVolumeClaim",
    "Pod"
  ],
  "graphDepth": 2,
  "requiredEvidence": [
    {
      "key": "pvc-pending",
      "predicate": "pvc-pending/v1",
      "maxAgeSeconds": 300,
      "required": true
    },
    {
      "key": "csi-error",
      "predicate": "csi-error/v1",
      "maxAgeSeconds": 300,
      "required": true
    },
    {
      "key": "storage-path",
      "predicate": "storage-path/v1",
      "maxAgeSeconds": 300,
      "required": true
    }
  ],
  "optionalEvidence": [
    "metric-context",
    "recent-change"
  ],
  "confirm": [
    "pvc-pending",
    "csi-error",
    "storage-path"
  ],
  "exclude": [
    "healthy-primary",
    "conflicting-required-facts",
    "invalid-path",
    "unreliable-clock"
  ],
  "toolAllowlist": [
    "read_evidence",
    "diagnostic_graph",
    "impact_scope"
  ],
  "budget": {
    "maxEvidence": 64,
    "maxNodes": 200,
    "maxEdges": 400,
    "timeoutMs": 3000
  },
  "postCheck": "fresh-required-evidence/v1",
  "graphPlan": "single-query/v1"
}
