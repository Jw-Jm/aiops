{
  "schemaVersion": "recipe-registry/v2",
  "name": "pod-crashloop-failure",
  "version": "v1",
  "candidateType": "pod_crash_loop",
  "entry": [
    "Pod",
    "Event"
  ],
  "graphDepth": 2,
  "graphPlan": "single-query/v1",
  "requiredEvidence": [
    {
      "key": "pod-crash-failing",
      "predicate": "pod-crash-failing/v1",
      "maxAgeSeconds": 300,
      "required": true
    },
    {
      "key": "container-backoff-error",
      "predicate": "container-backoff-error/v1",
      "maxAgeSeconds": 300,
      "required": true
    },
    {
      "key": "pod-path",
      "predicate": "pod-path/v1",
      "maxAgeSeconds": 300,
      "required": true
    }
  ],
  "optionalEvidence": [
    "metric-context",
    "recent-change"
  ],
  "confirm": [
    "pod-crash-failing",
    "container-backoff-error",
    "pod-path"
  ],
  "exclude": [
    "healthy-primary",
    "conflicting-required-facts",
    "invalid-path",
    "unreliable-clock"
  ],
  "toolAllowlist": [
    "read_evidence",
    "diagnostic_graph",
    "impact_scope"
  ],
  "budget": {
    "maxEvidence": 64,
    "maxNodes": 200,
    "maxEdges": 400,
    "timeoutMs": 3000
  },
  "postCheck": "native-related-health/v1"
}
