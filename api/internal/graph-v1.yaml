openapi: 3.0.3
info:
  title: Worker internal Graph protocol
  version: 1.0.0
paths:
  /internal/v1/graph:query:
    post:
      operationId: queryGraph
      security:
        - SignedContext: []
      parameters:
        - in: header
          name: X-Graph-Context
          required: true
          description: |
            Compact `base64url(claims).base64url(ed25519-signature)` envelope, valid
            for at most 30 seconds and bound to this exact body. It must name one
            explicit source; see SignedContextEnvelope. A source that is missing,
            unknown or incomplete is rejected, and a native source never falls back
            to the legacy role binding table.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GraphQuery'}
      responses:
        '200':
          description: User-scoped bounded result; partial is an explicit completeness failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphResult'}
        '503': {description: GRAPH_NOT_READY}
        '403': {description: FORBIDDEN}
        '409': {description: STALE_CONTEXT}
components:
  securitySchemes:
    SignedContext:
      type: apiKey
      in: header
      name: X-Graph-Context
      x-mutual-tls-required: true
      description: TLS client certificate is mandatory in addition to the signed audience-bound scope context.
  schemas:
    SignedContextEnvelope:
      type: object
      description: |
        Signed claims envelope inside X-Graph-Context (compact JWS-like, not JSON in
        the header). The Worker verifies the signature and the mTLS peer, then
        re-proves the source from persisted state: a live native session for
        `native_interactive`, or the persisted assistant task authority for
        `native_task`. `legacy` keeps the frozen role binding behaviour. The signed
        scope is only compared against the re-proven scope; it is never trusted on
        its own.
      additionalProperties: false
      required: [source, audience, subject, scope, deadline, queryDigest]
      properties:
        source: {type: string, enum: [legacy, native_interactive, native_task]}
        nativeProof:
          type: object
          additionalProperties: false
          description: >
            Only for native sources: a reference, never a credential. sessionId for
            native_interactive, jobId for native_task. No cookie, password, role or
            reusable credential is ever carried.
          properties:
            sessionId: {type: string, format: uuid}
            jobId: {type: string, format: uuid}
        grantSnapshotDigest: {type: string}
        audience: {type: string}
        subject: {type: string}
        scope: {$ref: '#/components/schemas/Scope'}
        deadline: {type: string, format: date-time}
        queryDigest: {type: string}
    GraphRevision:
      type: object
      required: [ownerEpoch, graphGeneration]
      properties:
        ownerEpoch: {type: integer, format: int64, minimum: 1}
        graphGeneration: {type: integer, format: int64, minimum: 1}
    Scope:
      type: object
      required: [tenantId, clusterUid, namespaces, resources, clusterScoped, authorizationRevision]
      properties:
        tenantId: {type: string}
        clusterUid: {type: string}
        namespaces: {type: array, items: {type: string}}
        resources: {type: array, items: {type: string}}
        clusterScoped: {type: boolean}
        authorizationRevision: {type: string}
    GraphQuery:
      type: object
      additionalProperties: false
      required: [queryKind, canonicalId, expectedOwnerEpoch, maxDepth, maxNodes, maxEdges, scope, relationKinds]
      properties:
        direction: {type: string, enum: [in, out, both]}
        queryKind: {type: string, enum: [entity, neighbors, dependencies, impact, diagnostic, list]}
        canonicalId: {type: string}
        canonicalIds: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, maxLength: 4096}}
        expectedOwnerEpoch: {type: integer, format: int64, minimum: 1}
        maxDepth: {type: integer, minimum: 1, maximum: 2}
        maxNodes: {type: integer, minimum: 1, maximum: 200}
        maxEdges: {type: integer, minimum: 1, maximum: 400}
        scope: {$ref: '#/components/schemas/Scope'}
        relationKinds: {type: array, items: {type: string}}
        cursorRevision: {$ref: '#/components/schemas/GraphRevision'}
        afterCanonicalId: {type: string}
        includeDomains: {type: boolean}
        domain: {type: string, enum: [hardware, kubernetes, network, storage]}
        kind: {type: string}
        name: {type: string}
        health: {type: string}
        label: {type: string}
        sort: {type: string}
        order: {type: string, enum: [asc, desc]}
        namespace: {type: string}
    GraphResult:
      type: object
      required: [schemaVersion, graphRevision, ownerInstance, collectedAt, freshness, partial, warnings, degradedSources, nodes, edges, budgets]
      properties:
        schemaVersion: {type: string, enum: [resource-graph/v2]}
        graphRevision: {$ref: '#/components/schemas/GraphRevision'}
        ownerInstance: {type: string}
        collectedAt: {type: string, format: date-time}
        freshness: {type: string, enum: [fresh, stale, unavailable]}
        partial: {type: boolean}
        warnings: {type: array, items: {type: string}}
        degradedSources: {type: array, items: {type: string}}
        nodes: {type: array, items: {type: object, additionalProperties: true}}
        edges: {type: array, items: {type: object, additionalProperties: true}}
        budgets: {type: object, additionalProperties: true}
        rankedEvidence: {type: array, items: {type: object, additionalProperties: true}}
        conflicts: {type: array, items: {type: object, additionalProperties: true}}
        directlyAffected: {type: array, items: {type: string}}
        indirectlyAffected: {type: array, items: {type: string}}
        dependencyOnly: {type: array, items: {type: string}}
        nextCanonicalId: {type: string}
