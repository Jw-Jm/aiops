      pattern: ^[a-z][a-z0-9.-]{0,62}\+v1://[A-Za-z0-9][A-Za-z0-9._~-]{0,127}/([A-Za-z0-9._~!$&'()*+,;=:@-]|%[0-9A-Fa-f]{2})+/([A-Za-z0-9._~!$&'()*+,;=:@-]|%[0-9A-Fa-f]{2})*/([A-Za-z0-9._~!$&'()*+,;=:@-]|%[0-9A-Fa-f]{2})+/([A-Za-z0-9._~!$&'()*+,;=:@-]|%[0-9A-Fa-f]{2})+$
    SP06CommonTenantId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    SP06CommonIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    SP06CommonExtensionValue:
      anyOf:
      - type: string
        maxLength: 4096
      - type: integer
        minimum: -2147483648
        maximum: 2147483647
      - type: number
        minimum: -2147483648
        maximum: 2147483647
      - type: boolean
      - type: 'null'
      - type: array
        items:
          $ref: '#/components/schemas/SP06CommonExtensionValue'
        maxItems: 100
      - type: object
        propertyNames:
          type: string
          maxLength: 64
        additionalProperties:
          $ref: '#/components/schemas/SP06CommonExtensionValue'
        maxProperties: 64
    PlatformCapabilitiesV1:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          const: platform-capabilities/v1
        apiReady:
          type: boolean
        graphReady:
          type:
          - boolean
          - 'null'
        sourceDegraded:
          type:
          - boolean
          - 'null'
        investigation:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            status:
              type: string
              enum:
              - disabled
              - unverified
              - degraded
            reason:
              type: string
              maxLength: 256
            readOnly:
              type: boolean
              const: true
          required:
          - enabled
          - status
          - reason
          - readOnly
        kubevirt:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
              - disabled
              - unverified
              - degraded
            reason:
              type: string
              maxLength: 256
            verification:
              type: string
              const: unverified
          required:
          - status
          - reason
        cdi:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
              - disabled
              - unverified
              - degraded
            reason:
              type: string
              maxLength: 256
            verification:
              type: string
              const: unverified
          required:
          - status
          - reason
        pyrca:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
              - disabled
              - unverified
              - degraded
            reason:
              type: string
              maxLength: 256
            verification:
              type: string
              const: unverified
          required:
          - status
          - reason
        commandExecution:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              enum:
              - disabled
              - unverified
              - degraded
            reason:
              type: string
              maxLength: 256
            verification:
              type: string
              const: unverified
          required:
          - status
          - reason
      required:
      - schemaVersion
      - apiReady
      - graphReady
      - sourceDegraded
      - investigation
      - kubevirt
      - cdi
      - pyrca
      - commandExecution
    CapabilitiesSuccessV1:
      type: object
      additionalProperties: false
      required:
      - requestId
      - data
      properties:
        requestId:
          type: string
        data:
          $ref: '#/components/schemas/PlatformCapabilitiesV1'
    OperatorRoleBindingStatusUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - status
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - active
          - disabled
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
