      type: object
      additionalProperties: false
      required:
      - evidenceId
      - hold
      properties:
        evidenceId:
          type: string
          format: uuid
        hold:
          type: boolean
    LegalHoldV1:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - hold
      properties:
        evidenceId:
          type: string
          format: uuid
        hold:
          type: boolean
    LegalHoldMetaV1:
      type: object
      additionalProperties: false
