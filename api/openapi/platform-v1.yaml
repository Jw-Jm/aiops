                  in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    minLength: 1
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/JSONRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessEnvelope'
                    description: Successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unified API error.
            security:
                - BearerAuth: []
            summary: createActionPlan
            tags:
                - ActionPlans
            x-idempotency: required
    /api/v1/action-plans/{actionPlanId}:
