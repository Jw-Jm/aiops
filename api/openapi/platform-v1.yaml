      - freshness
      - partial
      - warnings
      - degradedSources
      properties:
        nextCursor:
          type: string
        freshness:
          type: string
          enum:
          - fresh
          - stale
          - unavailable
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        degradedSources:
          type: array
          items:
            type: string
    LegalHoldPageV1:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - requestId
      - data
      - meta
