# OpenAPI 3.1 source of truth for public REST and SSE contracts.
components:
    schemas:
        CanonicalID:
            description: RFC 3986 percent-encoded in query parameters; JSON body values carry the decoded canonical identifier.
            format: canonical-id
            type: string
        CommandExecutionEvent:
            additionalProperties: false
            properties:
                eventId:
                    type: string
                eventType:
                    type: string
                executionId:
                    $ref: '#/components/schemas/Identifier'
                occurredAt:
                    format: date-time
                    type: string
                payload: {}
            required:
                - eventId
                - eventType
                - occurredAt
                - executionId
                - payload
            type: object
        CommandExecutionRequest:
            additionalProperties: false
            properties:
                actionPlanId:
                    type:
                        - string
                        - "null"
                actualCommand:
                    type: string
                executionProfileId:
                    $ref: '#/components/schemas/Identifier'
                riskAcknowledgementId:
                    $ref: '#/components/schemas/Identifier'
                shell:
                    type: string
                target:
                    $ref: '#/components/schemas/CanonicalID'
            required:
                - actualCommand
                - target
                - shell
                - executionProfileId
                - riskAcknowledgementId
            type: object
        DiagnosticGraphBuildRequest:
            additionalProperties: false
            properties:
                entryCanonicalId:
                    $ref: '#/components/schemas/CanonicalID'
                policy:
                    $ref: '#/components/schemas/GraphBudget'
                recipe:
                    enum:
                        - incident
                    type: string
            required:
                - entryCanonicalId
                - recipe
                - policy
            type: object
        ErrorEnvelope:
            additionalProperties: false
            properties:
                code:
                    enum:
                        - INVALID_ARGUMENT
                        - UNAUTHENTICATED
                        - FORBIDDEN
                        - NOT_FOUND
                        - CONFLICT
                        - PRECONDITION_FAILED
                        - RATE_LIMITED
                        - SOURCE_DEGRADED
                        - GRAPH_NOT_READY
                        - GRAPH_PARTIAL
                        - TIMEOUT
                        - BUDGET_EXHAUSTED
                        - POLICY_DENIED
                        - RISK_ACK_REQUIRED
                        - RISK_ACK_COMMAND_MISMATCH
                        - STEP_UP_REQUIRED
                        - STEP_UP_EXPIRED
                        - IDEMPOTENCY_CONFLICT
                        - INTERNAL
                        - CAPABILITY_DISABLED
                        - SOURCE_NOT_CONFIGURED
                        - IDEMPOTENCY_KEY_REUSED
                        - IDEMPOTENCY_IN_PROGRESS
                        - EXECUTION_PROFILE_DENIED
                        - COMMAND_POLICY_DENIED
                        - EXECUTION_UNKNOWN
                        - OUTPUT_TRUNCATED
                        - BUNDLE_SIGNATURE_INVALID
                        - BUNDLE_DIGEST_MISMATCH
                        - BUNDLE_EXTRACTION_REJECTED
                        - PROFILE_COMPONENT_CONFLICT
                        - UPSTREAM_COMPATIBILITY_UNVERIFIED
                        - OPENBAO_SEALED
                        - HOST_NOT_ONBOARDED
                    type: string
                details:
                    additionalProperties: true
                    type: object
                message:
                    type: string
                requestId:
                    $ref: '#/components/schemas/Identifier'
                retryable:
                    type: boolean
            required:
                - code
                - message
                - requestId
                - retryable
            type: object
        EvidenceQueryBudget:
            additionalProperties: false
            properties:
                maxBytes:
                    minimum: 1
                    type: integer
                timeoutMs:
                    minimum: 1
                    type: integer
            required:
                - timeoutMs
                - maxBytes
            type: object
        EvidenceQueryRequest:
            additionalProperties: false
            properties:
                budget:
                    $ref: '#/components/schemas/EvidenceQueryBudget'
                queryTemplate:
                    type: string
                resourceCanonicalId:
                    $ref: '#/components/schemas/CanonicalID'
                timeRange:
                    $ref: '#/components/schemas/EvidenceQueryTimeRange'
                type:
                    type: string
            required:
                - resourceCanonicalId
                - type
                - timeRange
                - queryTemplate
                - budget
            type: object
            x-contract-schema-id: https://ops.local/schemas/evidence/v1
        EvidenceQueryTimeRange:
            additionalProperties: false
            properties:
                from:
                    format: date-time
                    type: string
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
            type: object
        FindingEnvelope:
            additionalProperties: true
            description: Finding ingestion payload validated against finding-envelope/v1.
            type: object
            x-json-schema-id: https://ops.local/schemas/finding-envelope/v1
        GraphBudget:
            additionalProperties: false
            properties:
                maxDepth:
                    minimum: 0
                    type: integer
                maxEdges:
                    minimum: 1
                    type: integer
                maxNodes:
                    minimum: 1
                    type: integer
                timeoutMs:
                    minimum: 1
                    type: integer
            required:
                - maxDepth
                - maxNodes
                - maxEdges
                - timeoutMs
            type: object
        Identifier:
            format: identifier
            type: string
        ClusterRegistrationRequest:
            additionalProperties: false
            properties:
                clusterUid:
                    maxLength: 512
                    minLength: 1
                    type: string
                displayName:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - clusterUid
                - displayName
            type: object
        SourceCredentialRotationRequest:
            additionalProperties: false
            properties:
                authRef:
                    pattern: '^openbao://[A-Za-z0-9_./-]+$'
                    type: string
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - authRef
                - expectedRevision
            type: object
        SourceRegistrationRequest:
            additionalProperties: false
            properties:
                authRef:
                    pattern: '^openbao://[A-Za-z0-9_./-]+$'
                    type: string
                clusterId:
                    oneOf:
                        - $ref: '#/components/schemas/Identifier'
                        - type: 'null'
                instanceKey:
                    maxLength: 512
                    minLength: 1
                    type: string
                sourceType:
                    enum:
                        - victoriametrics
                        - victorialogs
                        - deepflow
                        - kubernetes
                        - redfish
                        - ipmi
                        - smart
                        - object_storage
                        - model
                    type: string
            required:
                - sourceType
                - instanceKey
                - authRef
            type: object
        SourceRegistrationUpdateRequest:
            additionalProperties: false
            anyOf:
                - required:
                    - clusterId
                - required:
                    - status
            properties:
                clusterId:
                    oneOf:
                        - $ref: '#/components/schemas/Identifier'
                        - type: 'null'
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
                status:
                    enum:
                        - active
                        - disabled
                    type: string
            required:
                - expectedRevision
            type: object
        SourceRegistrationRollbackRequest:
            additionalProperties: false
            properties:
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
                targetRevision:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - expectedRevision
                - targetRevision
            type: object
        PolicyBundlePublishRequest:
            additionalProperties: false
            properties:
                draftId:
                    $ref: '#/components/schemas/Identifier'
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
                signature:
                    contentEncoding: base64
                    minLength: 1
                    type: string
                signerKeyId:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - draftId
                - expectedRevision
                - signerKeyId
                - signature
            type: object
        RegistryActivationRequest:
            additionalProperties: false
            properties:
                clusterId:
                    oneOf:
                        - $ref: '#/components/schemas/Identifier'
                        - type: 'null'
                expectedRevision:
                    format: int64
                    minimum: 0
                    type: integer
                kind:
                    enum:
                        - policy
                        - recipe
                        - tool
                    type: string
                logicalName:
                    maxLength: 200
                    minLength: 1
                    type: string
                namespace:
                    maxLength: 63
                    minLength: 1
                    type: string
                scopeType:
                    enum:
                        - tenant
                        - cluster
                        - namespace
                    type: string
                versionId:
                    $ref: '#/components/schemas/Identifier'
            required:
                - kind
                - logicalName
                - versionId
                - scopeType
                - expectedRevision
            type: object
        RegistryDraftCreateRequest:
            additionalProperties: false
            properties:
                content:
                    additionalProperties: true
                    type: object
                kind:
                    enum:
                        - policy
                        - recipe
                        - tool
                    type: string
                logicalName:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - kind
                - logicalName
                - content
            type: object
        RegistryDraftUpdateRequest:
            additionalProperties: false
            properties:
                content:
                    additionalProperties: true
                    type: object
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - expectedRevision
                - content
            type: object
        RegistryPublishRequest:
            additionalProperties: false
            properties:
                expectedRevision:
                    format: int64
                    minimum: 1
                    type: integer
                signature:
                    contentEncoding: base64
                    minLength: 1
                    type: string
                signerKeyId:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - expectedRevision
                - signerKeyId
                - signature
            type: object
        RegistryVersionRetireRequest:
            additionalProperties: false
            properties:
                expectedDigest:
                    pattern: '^sha256:[0-9a-f]{64}$'
                    type: string
            required:
                - expectedDigest
            type: object
        IncidentTransitionRequest:
            additionalProperties: false
            properties:
                expectedRevision:
                    minimum: 1
                    type: integer
                reason:
                    type: string
                targetState:
                    type: string
            required:
                - targetState
                - reason
                - expectedRevision
            type: object
        InvestigationEvent:
            additionalProperties: false
            properties:
                eventId:
                    type: string
                eventType:
                    enum:
                        - job.state
                        - step.started
                        - step.completed
                        - evidence.added
                        - rca.updated
                        - job.completed
                    type: string
                jobId:
                    $ref: '#/components/schemas/Identifier'
                occurredAt:
                    format: date-time
                    type: string
                payload: {}
            required:
                - eventId
                - eventType
                - occurredAt
                - jobId
                - payload
            type: object
        JSONRequest:
            additionalProperties: true
            description: JSON object body. Operation-specific fields are defined by the owning public contract.
            type: object
        PageEnvelope:
            additionalProperties: false
            properties:
                data:
                    items: {}
                    type: array
                meta:
                    additionalProperties: true
                    properties:
                        nextCursor:
                            type: string
                    type: object
                requestId:
                    $ref: '#/components/schemas/Identifier'
            required:
                - data
                - requestId
                - meta
            type: object
        SuccessEnvelope:
            additionalProperties: false
            properties:
                data: {}
                meta:
                    additionalProperties: true
                    type: object
                requestId:
                    $ref: '#/components/schemas/Identifier'
            required:
                - data
                - requestId
            type: object
    securitySchemes:
        BearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    title: Smart Operations Platform API
    version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
