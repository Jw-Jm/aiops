components:
  schemas:
    ResourceGraphV2:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          enum:
          - resource-graph/v2
        graphRevision:
          type: object
          additionalProperties: false
          required:
          - ownerEpoch
          - graphGeneration
          properties:
            ownerEpoch:
              type: integer
              minimum: 1
            graphGeneration:
              type: integer
              minimum: 1
        ownerInstance:
          type: string
          minLength: 1
        collectedAt:
          type: string
          format: date-time
        freshness:
          enum:
          - fresh
          - stale
          - unavailable
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        degradedSources:
          type: array
          items:
            type: string
        nodes:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ResourceEntityV2'
        edges:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/ResourceRelationV2'
        budgets:
          type: object
          additionalProperties: false
          properties:
            maxDepth:
              type: integer
              minimum: 0
            storageMaxDepth:
              type: integer
              minimum: 0
            maxNodes:
              type: integer
              minimum: 0
            maxEdges:
              type: integer
              minimum: 0
            nodeCount:
              type: integer
              minimum: 0
            edgeCount:
              type: integer
              minimum: 0
            truncated:
              type: boolean
            truncationReasons:
              type: array
              items:
                type: string
          required:
          - maxDepth
          - storageMaxDepth
          - maxNodes
          - maxEdges
          - nodeCount
          - edgeCount
          - truncated
        rankedEvidence:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            properties:
              source:
                type: string
              nodeId:
                type: string
              edgeKey:
                type: string
              kind:
                type: string
              severity:
                type: string
              reason:
                type: string
              message:
                type: string
              confidence:
                type: string
              rank:
                type: integer
              score:
                type: number
              timestamp:
                type: string
                format: date-time
            required:
            - rank
            - source
        conflicts:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
              message:
                type: string
              nodeIds:
                type: array
                items:
                  type: string
              edgeKeys:
                type: array
                items:
                  type: string
              confidence:
                type: string
            required:
            - code
            - message
        nextCanonicalId:
          type: string
        directlyAffected:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CanonicalID'
        indirectlyAffected:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CanonicalID'
        dependencyOnly:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CanonicalID'
      required:
      - schemaVersion
      - graphRevision
      - ownerInstance
      - collectedAt
      - freshness
      - partial
      - warnings
      - degradedSources
      - nodes
      - edges
      - budgets
      - rankedEvidence
      - conflicts
    ResourceEntityV2:
      type: object
      properties:
        canonicalId:
          $ref: '#/components/schemas/CanonicalID'
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        domain:
          type: string
          minLength: 1
          maxLength: 256
        scope:
          type: string
          minLength: 1
          maxLength: 256
        apiGroup:
          type: string
          minLength: 0
          maxLength: 256
        kind:
          $ref: '#/components/schemas/Identifier'
        stableId:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 256
        namespace:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
        labels:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
          maxProperties: 256
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceAttributeValueV2'
          maxProperties: 256
        sourceRefs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
          maxItems: 1000
        firstObservedAt:
          type: string
          format: date-time
          maxLength: 64
        lastObservedAt:
          type: string
          format: date-time
          maxLength: 64
        extensions:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
      required:
      - canonicalId
      - tenantId
      - domain
      - scope
      - apiGroup
      - kind
      - stableId
      - name
      - namespace
      - labels
      - attributes
      - sourceRefs
      - firstObservedAt
      - lastObservedAt
      additionalProperties: false
    ResourceRelationV2:
      type: object
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/CanonicalID'
        to:
          $ref: '#/components/schemas/CanonicalID'
        kind:
          type: string
        provenance:
          type: object
          additionalProperties: false
          properties:
            sourceRegistrationId:
              type: string
            ruleVersion:
              type: string
            sourceValues:
              type:
              - object
              - 'null'
              additionalProperties:
                type: string
            observedAt:
              type: string
              format: date-time
          required:
          - sourceRegistrationId
          - ruleVersion
          - sourceValues
          - observedAt
        confidence:
          type: number
          minimum: 0
          maximum: 1
        observedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        ttl:
          type: integer
          minimum: 0
          maximum: 3600
      required:
      - from
      - to
      - kind
      - provenance
      - confidence
      - observedAt
      - validFrom
      - ttl
    EvidenceV2:
      type: object
      properties:
        schemaVersion:
          enum:
          - evidence/v2
        evidenceId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        resourceCanonicalId:
          $ref: '#/components/schemas/CanonicalID'
        type:
          enum:
          - metric
          - log
          - event
          - network
          - hardware
          - resource_state
          - change
        dataClass:
          enum:
          - D0
          - D1
          - D2
          - D3
        sourceRegistrationId:
          type: string
          format: uuid
        sourceSystem:
          type: string
        backendLogicalId:
          type: string
        queryTemplateVersion:
          type: string
        queryHash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        replayState:
          enum:
          - source_available
          - archive_pending
          - archived_verified
          - unavailable
        contentDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        independenceGroup:
          type: string
        sourceRevision:
          type: integer
          minimum: 1
        effectiveScope:
          type: object
          additionalProperties: false
          required:
          - tenantId
          - clusterUid
          - namespaces
          - resources
          - clusterScoped
          - authorizationRevision
          properties:
            tenantId:
              type: string
              format: uuid
            clusterUid:
              type: string
              minLength: 1
            namespaces:
              type: array
              items:
                type: string
              maxItems: 10000
            resources:
              type: array
              items:
                type: string
              maxItems: 10000
            clusterScoped:
              type: boolean
            authorizationRevision:
              type: string
              minLength: 1
        evaluatedAt:
          type: string
          format: date-time
        observedFrom:
          type: string
          format: date-time
        observedTo:
          type: string
          format: date-time
        sourceRetentionUntil:
          type: string
          format: date-time
        timeReliable:
          type: boolean
        derivationEvidenceRefs:
          type: array
          items:
            type: string
        archiveRef:
          type: object
          additionalProperties: false
          required:
          - backendLogicalId
          - object
          - encryptionKeyVersion
          - plaintextDigest
          - ciphertextDigest
          properties:
            backendLogicalId:
              type: string
              minLength: 1
            encryptionKeyVersion:
              type: string
              minLength: 1
            plaintextDigest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            ciphertextDigest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            object:
              type: object
              additionalProperties: false
              required:
              - tenantId
              - objectId
              - category
              - key
              - digest
              - size
              - contentType
              - versionId
              - retainUntil
              properties:
                tenantId:
                  type: string
                  format: uuid
                objectId:
                  type: string
                  format: uuid
                category:
                  type: string
                key:
                  type: string
                digest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                size:
                  type: integer
                  minimum: 1
                contentType:
                  type: string
                versionId:
                  type: string
                  minLength: 1
                etag:
                  type: string
                retainUntil:
                  type: string
                  format: date-time
        factSlice:
          anyOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
        sourceScopeDigest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
      required:
      - schemaVersion
      - evidenceId
      - tenantId
      - resourceCanonicalId
      - type
      - dataClass
      - sourceRegistrationId
      - sourceSystem
      - backendLogicalId
      - queryTemplateVersion
      - queryHash
      - replayState
      - contentDigest
      - independenceGroup
      - sourceRevision
      - effectiveScope
      - evaluatedAt
      - observedFrom
      - observedTo
      - sourceRetentionUntil
      - timeReliable
      - derivationEvidenceRefs
      additionalProperties: false
    EvidenceResultV2:
      type: object
      properties:
        schemaVersion:
          enum:
          - evidence-result/v2
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceV2'
        partial:
          type: boolean
        freshness:
          enum:
          - fresh
          - stale
          - unavailable
        degradedSources:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        queryHash:
          type: string
      required:
      - schemaVersion
      - evidence
      - partial
      - freshness
      - degradedSources
      - warnings
      - queryHash
      additionalProperties: false
    ResourceGraphSuccessV2:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        data:
          $ref: '#/components/schemas/ResourceGraphV2'
        meta:
          type: object
          additionalProperties: true
      required:
      - requestId
      - data
    EvidenceResultSuccessV2:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        data:
          $ref: '#/components/schemas/EvidenceResultV2'
        meta:
          type: object
          additionalProperties: true
      required:
      - requestId
      - data
    EvidenceSuccessV2:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        data:
          $ref: '#/components/schemas/EvidenceV2'
        meta:
          type: object
          additionalProperties: true
      required:
      - requestId
      - data
    ResourcePageV2:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEntityV2'
        meta:
          type: object
          additionalProperties: true
      required:
      - requestId
      - data
      - meta
    StepUpSession:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - expiresAt
      - lastUsedAt
      properties:
        sessionId:
          $ref: '#/components/schemas/Identifier'
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CanonicalID:
      description: RFC 3986 percent-encoded in query parameters; JSON body values
        carry the decoded canonical identifier.
      format: canonical-id
      type: string
    CommandExecutionEvent:
      additionalProperties: false
      properties:
        eventId:
          type: string
        eventType:
          type: string
        executionId:
          $ref: '#/components/schemas/Identifier'
        occurredAt:
          format: date-time
          type: string
        payload: {}
      required:
      - eventId
      - eventType
      - occurredAt
      - executionId
      - payload
      type: object
    CommandExecutionRequest:
      additionalProperties: false
      properties:
        actionPlanId:
          type:
          - string
          - 'null'
        actualCommand:
          type: string
        executionProfileId:
          $ref: '#/components/schemas/Identifier'
        riskAcknowledgementId:
          $ref: '#/components/schemas/Identifier'
        shell:
          type: string
        target:
          $ref: '#/components/schemas/CanonicalID'
      required:
      - actualCommand
      - target
      - shell
      - executionProfileId
      - riskAcknowledgementId
      type: object
    DiagnosticGraphBuildRequest:
      additionalProperties: false
      properties:
        entryCanonicalId:
          $ref: '#/components/schemas/CanonicalID'
        policy:
          $ref: '#/components/schemas/GraphBudget'
        recipe:
          enum:
          - incident
          type: string
      required:
      - entryCanonicalId
      - recipe
      - policy
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        code:
          enum:
          - INVALID_ARGUMENT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PRECONDITION_FAILED
          - RATE_LIMITED
          - SOURCE_DEGRADED
          - GRAPH_NOT_READY
          - GRAPH_PARTIAL
          - TIMEOUT
          - BUDGET_EXHAUSTED
          - POLICY_DENIED
          - RISK_ACK_REQUIRED
          - RISK_ACK_COMMAND_MISMATCH
          - STEP_UP_REQUIRED
          - STEP_UP_EXPIRED
          - IDEMPOTENCY_CONFLICT
          - INTERNAL
          - CAPABILITY_DISABLED
          - SOURCE_NOT_CONFIGURED
          - IDEMPOTENCY_IN_PROGRESS
          - IDEMPOTENCY_KEY_REUSED
          - EXECUTION_PROFILE_DENIED
          - COMMAND_POLICY_DENIED
          - EXECUTION_UNKNOWN
          - OUTPUT_TRUNCATED
          - BUNDLE_SIGNATURE_INVALID
          - BUNDLE_DIGEST_MISMATCH
          - BUNDLE_EXTRACTION_REJECTED
          - PROFILE_COMPONENT_CONFLICT
          - UPSTREAM_COMPATIBILITY_UNVERIFIED
          - OPENBAO_SEALED
          - HOST_NOT_ONBOARDED
          type: string
        details:
          additionalProperties: true
          type: object
        message:
          type: string
        requestId:
          $ref: '#/components/schemas/Identifier'
        retryable:
          type: boolean
      required:
      - code
      - message
      - requestId
      - retryable
      type: object
    EvidenceQueryBudget:
      additionalProperties: false
      properties:
        maxBytes:
          minimum: 1
          type: integer
        timeoutMs:
          minimum: 1
          type: integer
      required:
      - timeoutMs
      - maxBytes
      type: object
    EvidenceQueryRequest:
      additionalProperties: false
      properties:
        sourceRegistrationId:
          type: string
          format: uuid
        namespace:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
        budget:
          $ref: '#/components/schemas/EvidenceQueryBudget'
        queryTemplate:
          type: string
        resourceCanonicalId:
          $ref: '#/components/schemas/CanonicalID'
        timeRange:
          $ref: '#/components/schemas/EvidenceQueryTimeRange'
        type:
          type: string
      required:
      - resourceCanonicalId
      - type
      - timeRange
      - queryTemplate
      - budget
      type: object
      x-contract-schema-id: https://ops.local/schemas/evidence-result/v2
    EvidenceQueryTimeRange:
      additionalProperties: false
      properties:
        from:
          format: date-time
          type: string
        to:
          format: date-time
          type: string
      required:
      - from
      - to
      type: object
    FindingEnvelope:
      additionalProperties: true
      description: Finding ingestion payload validated against finding-envelope/v1.
      type: object
      x-json-schema-id: https://ops.local/schemas/finding-envelope/v1
    GraphBudget:
      additionalProperties: false
      properties:
        maxDepth:
          minimum: 0
          type: integer
        maxEdges:
          minimum: 1
          type: integer
        maxNodes:
          minimum: 1
          type: integer
        timeoutMs:
          minimum: 1
          type: integer
      required:
      - maxDepth
      - maxNodes
      - maxEdges
      - timeoutMs
      type: object
    Identifier:
      format: identifier
      type: string
    ClusterRegistrationRequest:
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          description: Required to explicitly complete or update metadata of an existing
            stable cluster identity.
        apiEndpointRef:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^openbao://[A-Za-z0-9_./-]+$
        distribution:
          type: string
          minLength: 1
          maxLength: 64
        actualVersions:
          type: object
          minProperties: 1
          maxProperties: 64
          required:
          - kubernetes
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        capabilities:
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            type: boolean
        clusterUid:
          maxLength: 512
          minLength: 1
          type: string
        displayName:
          maxLength: 200
          minLength: 1
          type: string
      required:
      - clusterUid
      - displayName
      - apiEndpointRef
      - distribution
      - actualVersions
      - capabilities
      type: object
    SourceCredentialRotationRequest:
      additionalProperties: false
      properties:
        authRef:
          pattern: ^openbao://[A-Za-z0-9_./-]+$
          type: string
        expectedRevision:
          format: int64
          minimum: 1
          type: integer
      required:
      - authRef
      - expectedRevision
      type: object
    SourceDataScopeMapping:
      description: Declared exact scopes; empty scopes grant no permission. Backend
        verification is read-only and unavailable until adapter admission.
      type: object
      additionalProperties: false
      properties:
        nativeTenant:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
        scopes:
          type: object
          additionalProperties: false
          properties:
            account:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
            project:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
            organization:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
            team:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
            cluster:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
            namespace:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
                pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
        requiredLabels:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 512
            pattern: ^[^*|~\[\]{}()^$\\\t\r\n]+$
    SourceRegistration:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - sourceId
      - sourceType
      - instanceKey
      - clusterId
      - clusterUid
      - authRef
      - credentialRevision
      - allowedSchemas
      - backendLogicalId
      - dataScopeMapping
      - queryCapability
      - status
      - revision
      - createdAt
      - updatedAt
      properties:
        tenantId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        sourceType:
          type: string
        instanceKey:
          type: string
        clusterId:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        clusterUid:
          type: string
        authRef:
          type: string
        credentialRevision:
          type: integer
          format: int64
          minimum: 1
        allowedSchemas:
          type: array
          items:
            type: string
            enum:
            - finding-envelope/v1
          maxItems: 1
        backendLogicalId:
          description: Stable backend identity; an empty legacy value grants no query
            capability.
          type: string
          maxLength: 512
        dataScopeMapping:
          $ref: '#/components/schemas/SourceDataScopeMapping'
        queryCapability:
          description: A declaration cannot enable queries. Adapter admission requires
            a separately versioned verification contract.
          type: object
          readOnly: true
          additionalProperties: false
          required:
          - state
          - verification
          - reason
          properties:
            state:
              type: string
              enum:
              - disabled
            verification:
              type: string
              enum:
              - unverified
            reason:
              type: string
              enum:
              - adapter_scope_verification_pending
        status:
          type: string
          enum:
          - active
          - disabled
          - rotated
        revision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SourceRegistrationEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - requestId
      properties:
        data:
          $ref: '#/components/schemas/SourceRegistration'
        requestId:
          $ref: '#/components/schemas/Identifier'
    SourceRegistrationPageEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - requestId
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceRegistration'
        meta:
          type: object
          additionalProperties: false
          properties:
            nextCursor:
              oneOf:
              - type: string
              - type: 'null'
        requestId:
          $ref: '#/components/schemas/Identifier'
    SourceRegistrationRequest:
      additionalProperties: false
      properties:
        backendLogicalId:
          type: string
          minLength: 1
          maxLength: 512
        dataScopeMapping:
          $ref: '#/components/schemas/SourceDataScopeMapping'
        allowedSchemas:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - finding-envelope/v1
        authRef:
          pattern: ^openbao://[A-Za-z0-9_./-]+$
          type: string
        clusterId:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        instanceKey:
          maxLength: 512
          minLength: 1
          type: string
        sourceType:
          enum:
          - victoriametrics
          - victorialogs
          - deepflow
          - kubernetes
          - redfish
          - ipmi
          - smart
          - object_storage
          - model
          type: string
      required:
      - sourceType
      - instanceKey
      - authRef
      - allowedSchemas
      type: object
    SourceRegistrationUpdateRequest:
      additionalProperties: false
      anyOf:
      - required:
        - clusterId
      - required:
        - status
      - required:
        - allowedSchemas
      - required:
        - backendLogicalId
      - required:
        - dataScopeMapping
      properties:
        backendLogicalId:
          type: string
          minLength: 1
          maxLength: 512
