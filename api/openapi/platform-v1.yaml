          type: string
          minLength: 1
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - evidenceId
            - hold
            properties:
              evidenceId:
                type: string
                format: uuid
              hold:
                type: boolean
        meta:
          type: object
          additionalProperties: false
          required:
          - nextCursor
          - freshness
          - partial
          - warnings
          - degradedSources
          properties:
            nextCursor:
              type: string
            freshness:
              type: string
              enum:
              - fresh
              - stale
              - unavailable
            partial:
              type: boolean
            warnings:
              type: array
              items:
                type: string
            degradedSources:
              type: array
              items:
                type: string
    LegalHoldResultV1:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - requestId
      - data
      - meta
      - protectionSync
      properties:
        schemaVersion:
          type: string
          enum:
          - legal-hold-result/v1
        requestId:
          type: string
          minLength: 1
        data:
          type: object
          additionalProperties: false
          required:
          - evidenceId
          - hold
          properties:
            evidenceId:
              type: string
              format: uuid
            hold:
              type: boolean
        meta:
          type: object
          additionalProperties: false
          required:
          - nextCursor
          - freshness
          - partial
          - warnings
          - degradedSources
          properties:
            nextCursor:
              type: string
            freshness:
              type: string
              enum:
              - fresh
              - stale
              - unavailable
            partial:
              type: boolean
            warnings:
              type: array
              items:
                type: string
            degradedSources:
              type: array
              items:
                type: string
        protectionSync:
          type: string
          enum:
          - pending
    ResourceAttributeValueV2:
      anyOf:
      - type: string
        maxLength: 4096
      - type: integer
        minimum: -9007199254740991
        maximum: 9007199254740991
      - type: number
        minimum: -9007199254740991
        maximum: 9007199254740991
      - type: boolean
      - type: 'null'
      - type: array
        items:
          $ref: '#/components/schemas/ResourceAttributeValueV2'
        maxItems: 100
      - type: object
        propertyNames:
          type: string
          maxLength: 64
        additionalProperties:
          $ref: '#/components/schemas/ResourceAttributeValueV2'
        maxProperties: 64
      description: Bounded JSON-safe resource quantities, including hardware byte
        capacities. Public v1 common extension limits remain unchanged.
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
